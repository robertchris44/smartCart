<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#059669" />
  <title>SmartCart Meal & Budget Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24 font-sans">

  <!-- Sticky Budget Header -->
  <header id="budget-bar" class="sticky top-0 z-50 bg-emerald-600 text-white shadow-md transition-colors duration-300">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-bold text-lg tracking-tight">SmartCart Planner</h1>
        <p id="store-badge" class="text-xs text-emerald-100">Store: Food Lion (0.92x avg)</p>
      </div>
      <div class="text-right">
        <div class="text-xs uppercase tracking-wider opacity-85">Est. Total / Budget</div>
        <div class="font-extrabold text-xl">
          $<span id="total-cost">0.00</span> <span class="text-sm font-normal opacity-90">/ $<span id="display-budget">150</span></span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-5">

    <!-- 1. Store, Budget & Allergies -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Grocery Store</label>
          <select id="store-select" class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="0.88" data-name="Aldi / Lidl">Aldi / Lidl (0.88x)</option>
            <option value="0.92" data-name="Food Lion" selected>Food Lion (0.92x)</option>
            <option value="0.95" data-name="Walmart">Walmart (0.95x)</option>
            <option value="1.00" data-name="Kroger / Target">Kroger / Target (1.00x)</option>
            <option value="1.12" data-name="Publix">Publix (1.12x)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Max Budget ($)</label>
          <input type="number" id="budget-input" value="150" min="10" step="5"
            class="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">Allergies & Dietary Filters</label>
        <div class="flex flex-wrap gap-2" id="allergy-filters">
          <button type="button" data-allergy="gluten" class="allergy-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-300 bg-white text-slate-600 transition">Gluten-Free</button>
          <button type="button" data-allergy="dairy" class="allergy-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-300 bg-white text-slate-600 transition">Lactose / Dairy-Free</button>
          <button type="button" data-allergy="treenut" class="allergy-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-300 bg-white text-slate-600 transition">Tree Nut-Free</button>
          <button type="button" data-allergy="shellfish" class="allergy-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-300 bg-white text-slate-600 transition">Shellfish-Free</button>
        </div>
      </div>
    </section>

    <!-- 2. Hybrid Meal Builder -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="font-bold text-base text-slate-800">1. Choose Your Meals</h2>
          <p class="text-xs text-slate-500">Pick anchor meals or tap Auto-Fill to fit your budget.</p>
        </div>
        <button id="auto-fill-btn" class="bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow-sm transition">
          ✨ Fill Budget
        </button>
      </div>

      <!-- Custom Meal Adder -->
      <div class="flex gap-2 pt-1">
        <input type="text" id="custom-meal-name" placeholder="Add your own meal (e.g. Taco Night)"
          class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        <input type="number" id="custom-meal-cost" placeholder="$ Est."
          class="w-20 bg-slate-100 border border-slate-200 rounded-xl px-2.5 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        <button id="add-custom-meal-btn" class="bg-slate-800 text-white text-xs font-bold px-3 rounded-xl">+</button>
      </div>

      <!-- Meal Cards -->
      <div id="meal-list" class="space-y-2 pt-2"></div>
    </section>

    <!-- 3. Aisle-Sorted Shopping List (Tap to Override Price) -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="font-bold text-base text-slate-800">2. Shopping List</h2>
          <p class="text-xs text-slate-500">Tap any price in-store to save your local price.</p>
        </div>
        <button id="reset-prices-btn" class="text-xs text-slate-400 underline">Reset Prices</button>
      </div>

      <div id="shopping-list" class="divide-y divide-slate-100">
        <p class="text-xs text-slate-400 py-4 text-center">Select meals above to generate your shopping list.</p>
      </div>
    </section>

  </main>

  <script>
    // Starter Recipe Database (Family-sized portions, ~5 servings)
    const MEALS_DB = [
      {
        id: 'sheet-pan-fajitas',
        name: 'Sheet Pan Chicken Fajitas',
        allergens: [],
        tags: ['High Protein', 'Kid Friendly'],
        ingredients: [
          { name: 'Chicken Breast (2.5 lbs)', aisle: 'Meat', basePrice: 8.50 },
          { name: 'Bell Peppers (3 pack)', aisle: 'Produce', basePrice: 3.99 },
          { name: 'Yellow Onion (2)', aisle: 'Produce', basePrice: 1.80 },
          { name: 'Corn Tortillas (GF)', aisle: 'Bakery/Tortillas', basePrice: 2.99 }
        ]
      },
      {
        id: 'baked-ziti',
        name: 'Classic Baked Ziti & Meat Sauce',
        allergens: ['gluten', 'dairy'],
        tags: ['Leftover Friendly'],
        ingredients: [
          { name: 'Ground Beef (1.5 lbs)', aisle: 'Meat', basePrice: 7.50 },
          { name: 'Ziti Pasta (16 oz)', aisle: 'Pantry', basePrice: 1.79 },
          { name: 'Marinara Sauce (24 oz)', aisle: 'Pantry', basePrice: 2.89 },
          { name: 'Shredded Mozzarella', aisle: 'Dairy', basePrice: 3.99 }
        ]
      },
      {
        id: 'pork-tenderloin',
        name: 'Roasted Pork Loin & Green Beans',
        allergens: [],
        tags: ['Budget Pick'],
        ingredients: [
          { name: 'Pork Tenderloin (2 lbs)', aisle: 'Meat', basePrice: 7.99 },
          { name: 'Fresh Green Beans (1 lb)', aisle: 'Produce', basePrice: 2.49 },
          { name: 'Baby Gold Potatoes (3 lbs)', aisle: 'Produce', basePrice: 3.99 }
        ]
      },
      {
        id: 'teriyaki-salmon-bowls',
        name: 'Teriyaki Salmon & Rice Bowls',
        allergens: ['gluten'],
        tags: ['Quick 20-Min'],
        ingredients: [
          { name: 'Salmon Fillets (1.5 lbs)', aisle: 'Seafood', basePrice: 12.99 },
          { name: 'Jasmine Rice (2 lbs)', aisle: 'Pantry', basePrice: 3.29 },
          { name: 'Broccoli Crowns (1.5 lbs)', aisle: 'Produce', basePrice: 2.99 },
          { name: 'Teriyaki Glaze', aisle: 'Pantry', basePrice: 3.49 }
        ]
      },
      {
        id: 'shrimp-tacos',
        name: 'Baja Shrimp Tacos & Street Corn',
        allergens: ['shellfish', 'dairy'],
        tags: ['Family Favorite'],
        ingredients: [
          { name: 'Frozen Raw Shrimp (1.5 lbs)', aisle: 'Seafood', basePrice: 9.99 },
          { name: 'Corn Tortillas (GF)', aisle: 'Bakery/Tortillas', basePrice: 2.99 },
          { name: 'Shredded Cabbage Slaw', aisle: 'Produce', basePrice: 2.29 },
          { name: 'Frozen Corn & Cotija Cheese', aisle: 'Dairy', basePrice: 4.50 }
        ]
      },
      {
        id: 'peanut-chicken-stirfry',
        name: 'Thai Peanut Chicken Stir-Fry',
        allergens: ['treenut', 'gluten'],
        tags: ['Takeout Fakeout'],
        ingredients: [
          { name: 'Chicken Thighs (2 lbs)', aisle: 'Meat', basePrice: 6.50 },
          { name: 'Stir-Fry Veggie Blend', aisle: 'Produce', basePrice: 3.79 },
          { name: 'Jasmine Rice (2 lbs)', aisle: 'Pantry', basePrice: 3.29 },
          { name: 'Thai Peanut Sauce', aisle: 'Pantry', basePrice: 3.99 }
        ]
      }
    ];

    // State Management with LocalStorage
    let state = {
      budget: parseFloat(localStorage.getItem('sc_budget')) || 150,
      multiplier: parseFloat(localStorage.getItem('sc_multiplier')) || 0.92,
      storeName: localStorage.getItem('sc_storeName') || 'Food Lion',
      allergies: JSON.parse(localStorage.getItem('sc_allergies')) || [],
      selectedMealIds: JSON.parse(localStorage.getItem('sc_selectedMeals')) || ['sheet-pan-fajitas'],
      customMeals: JSON.parse(localStorage.getItem('sc_customMeals')) || [],
      priceOverrides: JSON.parse(localStorage.getItem('sc_priceOverrides')) || {},
      checkedItems: JSON.parse(localStorage.getItem('sc_checkedItems')) || {}
    };

    function saveState() {
      localStorage.setItem('sc_budget', state.budget);
      localStorage.setItem('sc_multiplier', state.multiplier);
      localStorage.setItem('sc_storeName', state.storeName);
      localStorage.setItem('sc_allergies', JSON.stringify(state.allergies));
      localStorage.setItem('sc_selectedMeals', JSON.stringify(state.selectedMealIds));
      localStorage.setItem('sc_customMeals', JSON.stringify(state.customMeals));
      localStorage.setItem('sc_priceOverrides', JSON.stringify(state.priceOverrides));
      localStorage.setItem('sc_checkedItems', JSON.stringify(state.checkedItems));
    }

    function getItemPrice(item) {
      if (state.priceOverrides[item.name] !== undefined) {
        return state.priceOverrides[item.name];
      }
      return +(item.basePrice * state.multiplier).toFixed(2);
    }

    function getMealCost(meal) {
      return meal.ingredients.reduce((sum, ing) => sum + getItemPrice(ing), 0);
    }

    function isMealSafe(meal) {
      return !meal.allergens.some(a => state.allergies.includes(a));
    }

    function render() {
      document.getElementById('budget-input').value = state.budget;
      document.getElementById('display-budget').textContent = state.budget;
      document.getElementById('store-badge').textContent = `Store: ${state.storeName} (${state.multiplier}x avg)`;

      const storeSelect = document.getElementById('store-select');
      for (let i = 0; i < storeSelect.options.length; i++) {
        if (storeSelect.options[i].dataset.name === state.storeName) {
          storeSelect.selectedIndex = i;
          break;
        }
      }

      document.querySelectorAll('.allergy-btn').forEach(btn => {
        const allergy = btn.dataset.allergy;
        if (state.allergies.includes(allergy)) {
          btn.classList.add('bg-amber-500', 'text-white', 'border-amber-500');
          btn.classList.remove('bg-white', 'text-slate-600', 'border-slate-300');
        } else {
          btn.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
          btn.classList.add('bg-white', 'text-slate-600', 'border-slate-300');
        }
      });

      const allMeals = [...MEALS_DB, ...state.customMeals];
      const mealListEl = document.getElementById('meal-list');
      mealListEl.innerHTML = '';

      allMeals.forEach(meal => {
        const safe = isMealSafe(meal);
        const selected = state.selectedMealIds.includes(meal.id);
        const cost = getMealCost(meal).toFixed(2);

        if (!safe && !selected) return;

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex justify-between items-center cursor-pointer transition ${
          selected ? 'bg-emerald-50 border-emerald-500' : 'bg-slate-50 border-slate-200'
        }`;
        card.innerHTML = `
          <div class="pr-2">
            <div class="font-semibold text-sm text-slate-800 flex items-center gap-1.5">
              <span>${selected ? '✅' : '➕'}</span>
              <span>${meal.name}</span>
            </div>
            <div class="text-[11px] text-slate-500 mt-0.5">
              ${meal.tags.join(' • ')} ${!safe ? '<span class="text-red-600 font-bold">(Allergy Warning)</span>' : ''}
            </div>
          </div>
          <div class="text-right shrink-0">
            <span class="font-bold text-sm text-slate-800">$${cost}</span>
          </div>
        `;
        card.onclick = () => {
          if (selected) {
            state.selectedMealIds = state.selectedMealIds.filter(id => id !== meal.id);
          } else {
            state.selectedMealIds.push(meal.id);
          }
          saveState();
          render();
        };
        mealListEl.appendChild(card);
      });

      const selectedMeals = allMeals.filter(m => state.selectedMealIds.includes(m.id));
      const itemMap = {};
      selectedMeals.forEach(meal => {
        meal.ingredients.forEach(ing => {
          if (!itemMap[ing.name]) {
            itemMap[ing.name] = { ...ing, count: 1 };
          } else {
            itemMap[ing.name].count += 1;
          }
        });
      });

      const items = Object.values(itemMap).sort((a, b) => a.aisle.localeCompare(b.aisle));
      const shoppingListEl = document.getElementById('shopping-list');
      let grandTotal = 0;

      if (items.length === 0) {
        shoppingListEl.innerHTML = '<p class="text-xs text-slate-400 py-4 text-center">Select meals above to generate your shopping list.</p>';
      } else {
        shoppingListEl.innerHTML = '';
        items.forEach(item => {
          const unitPrice = getItemPrice(item);
          const lineTotal = unitPrice * item.count;
          grandTotal += lineTotal;
          const isOverridden = state.priceOverrides[item.name] !== undefined;
          const isChecked = !!state.checkedItems[item.name];

          const row = document.createElement('div');
          row.className = `py-2.5 flex justify-between items-center ${isChecked ? 'opacity-45 line-through' : ''}`;
          row.innerHTML = `
            <div class="flex items-center gap-2.5 cursor-pointer flex-1" onclick="toggleCheck('${item.name.replace(/'/g, "\'")}')">
              <input type="checkbox" ${isChecked ? 'checked' : ''} class="w-4 h-4 accent-emerald-600 rounded" />
              <div>
                <div class="text-sm font-medium text-slate-800">${item.name} ${item.count > 1 ? `<span class="text-xs font-bold text-emerald-700">(x${item.count})</span>` : ''}</div>
                <div class="text-[11px] text-slate-400">${item.aisle} ${isOverridden ? '• <span class="text-blue-600 font-semibold">Custom Local Price</span>' : ''}</div>
              </div>
            </div>
            <button onclick="editPrice('${item.name.replace(/'/g, "\'")}', ${unitPrice})"
              class="px-2.5 py-1 rounded-lg text-sm font-bold ${isOverridden ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-700'}">
              $${lineTotal.toFixed(2)}
            </button>
          `;
          shoppingListEl.appendChild(row);
        });
      }

      document.getElementById('total-cost').textContent = grandTotal.toFixed(2);
      const bar = document.getElementById('budget-bar');
      if (grandTotal > state.budget) {
        bar.classList.remove('bg-emerald-600');
        bar.classList.add('bg-rose-600');
      } else {
        bar.classList.add('bg-emerald-600');
        bar.classList.remove('bg-rose-600');
      }
    }

    window.toggleCheck = (name) => {
      state.checkedItems[name] = !state.checkedItems[name];
      saveState();
      render();
    };

    window.editPrice = (name, currentUnitPrice) => {
      const input = prompt(`Enter actual store price for 1x ${name}:`, currentUnitPrice.toFixed(2));
      if (input !== null && !isNaN(parseFloat(input))) {
        state.priceOverrides[name] = parseFloat(input);
        saveState();
        render();
      }
    };

    document.getElementById('store-select').addEventListener('change', (e) => {
      state.multiplier = parseFloat(e.target.value);
      state.storeName = e.target.options[e.target.selectedIndex].dataset.name;
      saveState();
      render();
    });

    document.getElementById('budget-input').addEventListener('input', (e) => {
      state.budget = parseFloat(e.target.value) || 0;
      saveState();
      render();
    });

    document.querySelectorAll('.allergy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const allergy = btn.dataset.allergy;
        if (state.allergies.includes(allergy)) {
          state.allergies = state.allergies.filter(a => a !== allergy);
        } else {
          state.allergies.push(allergy);
        }
        saveState();
        render();
      });
    });

    document.getElementById('auto-fill-btn').addEventListener('click', () => {
      const allMeals = [...MEALS_DB, ...state.customMeals];
      let currentTotal = allMeals
        .filter(m => state.selectedMealIds.includes(m.id))
        .reduce((sum, m) => sum + getMealCost(m), 0);

      const candidates = allMeals.filter(m => !state.selectedMealIds.includes(m.id) && isMealSafe(m));
      candidates.sort(() => Math.random() - 0.5);

      for (const meal of candidates) {
        const cost = getMealCost(meal);
        if (currentTotal + cost <= state.budget) {
          state.selectedMealIds.push(meal.id);
          currentTotal += cost;
        }
      }
      saveState();
      render();
    });

    document.getElementById('add-custom-meal-btn').addEventListener('click', () => {
      const nameInput = document.getElementById('custom-meal-name');
      const costInput = document.getElementById('custom-meal-cost');
      const name = nameInput.value.trim();
      const cost = parseFloat(costInput.value) || 15;

      if (!name) return;

      const newId = 'custom-' + Date.now();
      state.customMeals.push({
        id: newId,
        name: name,
        allergens: [],
        tags: ['Custom Meal'],
        ingredients: [
          { name: `${name} Ingredients`, aisle: 'Custom', basePrice: +(cost / state.multiplier).toFixed(2) }
        ]
      });
      state.selectedMealIds.push(newId);
      nameInput.value = '';
      costInput.value = '';
      saveState();
      render();
    });

    document.getElementById('reset-prices-btn').addEventListener('click', () => {
      if (confirm('Clear all custom store prices?')) {
        state.priceOverrides = {};
        saveState();
        render();
      }
    });

    render();
  </script>
</body>
</html>
